<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Analytics - arXiv 论文分析平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 40px 0;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 标签页导航 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.3);
        }

        /* 面板 */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* 搜索区域 */
        .section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        /* 热门研究方向 */
        .directions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .direction-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .direction-tag:hover {
            background: #667eea;
            color: white;
        }

        /* 搜索建议 */
        .suggestions {
            margin-top: 15px;
            display: none;
        }

        .suggestion-item {
            padding: 10px 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: #e9e9e9;
        }

        /* 子方向 */
        .sub-directions {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .sub-direction-tag {
            display: inline-block;
            padding: 6px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .sub-direction-tag:hover {
            border-color: #667eea;
            color: #667eea;
        }

        /* 爬虫配置表单 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 500;
            color: #555;
        }

        .form-input, .form-select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .category-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .start-crawler-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-crawler-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16,185,129,0.4);
        }

        .start-crawler-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 日志区域 */
        .log-container {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }

        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid #334155;
        }

        /* 论文列表 */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .results-count {
            font-size: 1.1rem;
            color: #666;
        }

        .paper-card {
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .paper-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102,126,234,0.1);
            transform: translateY(-2px);
        }

        .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .paper-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .paper-tag {
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .paper-links {
            margin-top: 10px;
        }

        .paper-link {
            color: #667eea;
            text-decoration: none;
            margin-right: 15px;
            font-size: 0.9rem;
        }

        .paper-link:hover {
            text-decoration: underline;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* 状态徽章 */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-badge.running {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.idle {
            background: #f1f5f9;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Spy Analytics</h1>
            <p>arXiv 论文智能分析平台</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('search')">🔍 搜索论文</button>
            <button class="tab-btn" onclick="switchTab('crawler')">🕷️ 数据采集</button>
        </div>

        <!-- 搜索面板 -->
        <div id="search-panel" class="panel active">
            <div class="section">
                <h2 class="section-title">论文搜索</h2>
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="输入关键词搜索论文标题..."
                    >
                    <button class="search-btn" onclick="doSearch()">🔍 搜索</button>
                </div>
                
                <div>
                    <p style="margin-bottom:10px;font-weight:500;">热门研究方向：</p>
                    <div class="directions" id="directionsList">
                    </div>
                </div>

                <div class="suggestions" id="suggestions">
                </div>

                <div class="sub-directions" id="subDirections">
                    <p style="margin-bottom:10px;font-weight:500;">相关子方向：</p>
                    <div id="subDirectionsList"></div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在搜索论文...</p>
            </div>

            <div class="section" id="resultsSection" style="display:none;">
                <div class="results-header">
                    <h2>📄 搜索结果</h2>
                    <span class="results-count" id="resultsCount"></span>
                </div>
                <div id="papersList"></div>
            </div>
        </div>

        <!-- 爬虫面板 -->
        <div id="crawler-panel" class="panel">
            <div class="section">
                <h2 class="section-title">爬虫配置</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">爬取时间范围（年）</label>
                        <input type="number" id="yearsInput" class="form-input" value="0.5" step="0.1" min="0.1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">每类最大论文数</label>
                        <input type="number" id="maxResultsInput" class="form-input" value="50" min="10" max="500">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">选择研究方向：</label>
                    <div class="category-checkboxes" id="categoryCheckboxes">
                    </div>
                </div>

                <div style="margin-top: 20px; display: flex; align-items: center; gap: 20px;">
                    <button id="startCrawlerBtn" class="start-crawler-btn" onclick="startCrawler()">
                        🚀 开始爬取
                    </button>
                    <div id="statusBadge" class="status-badge idle">
                        ⏸️ 空闲
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">运行日志</h2>
                <div id="logContainer" class="log-container">
                    <div class="log-line">等待启动爬虫...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allDirections = [];
        let allCategories = [];
        let logRefreshInterval = null;

        // 页面加载
        document.addEventListener('DOMContentLoaded', async function() {
            await loadDirections();
            await loadCategories();
        });

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab + '-panel').classList.add('active');
            event.target.classList.add('active');

            // 如果切换到爬虫面板，检查状态
            if (tab === 'crawler') {
                refreshCrawlerStatus();
                logRefreshInterval = setInterval(refreshCrawlerStatus, 2000);
            } else {
                if (logRefreshInterval) {
                    clearInterval(logRefreshInterval);
                }
            }
        }

        // 加载研究方向
        async function loadDirections() {
            try {
                const response = await fetch('/papers/research-directions');
                const data = await response.json();
                allDirections = data.directions;
                renderDirections(allDirections);
            } catch (error) {
                console.error('加载研究方向失败:', error);
            }
        }

        // 加载分类
        async function loadCategories() {
            try {
                const response = await fetch('/crawler/directions');
                const data = await response.json();
                allCategories = data.directions;
                renderCategories(allCategories);
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        // 渲染研究方向标签
        function renderDirections(directions) {
            const container = document.getElementById('directionsList');
            container.innerHTML = directions.map(d => 
                `<span class="direction-tag" onclick="searchByDirection('${d.name}')">${d.name}</span>`
            ).join('');
        }

        // 渲染分类复选框
        function renderCategories(categories) {
            const container = document.getElementById('categoryCheckboxes');
            container.innerHTML = categories.map(cat => `
                <label class="category-item">
                    <input type="checkbox" value="${cat.code}" checked>
                    ${cat.name} (${cat.code})
                </label>
            `).join('');
        }

        // 按研究方向搜索
        async function searchByDirection(direction) {
            document.getElementById('searchInput').value = direction;
            doSearch();
        }

        // 执行搜索
        async function doSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入搜索内容');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('subDirections').style.display = 'none';
            document.getElementById('suggestions').style.display = 'none';

            try {
                const response = await fetch(`/papers/search/title?keyword=${encodeURIComponent(keyword)}`);
                const data = await response.json();
                renderSearchResults(data);
            } catch (error) {
                console.error('搜索失败:', error);
                alert('搜索失败，请稍后重试');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 渲染搜索结果
        function renderSearchResults(data) {
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultsCount').textContent = `找到 ${data.total} 篇论文`;
            
            const papersList = document.getElementById('papersList');
            
            if (data.papers && data.papers.length > 0) {
                papersList.innerHTML = data.papers.map(paper => renderPaperCard(paper)).join('');
            } else {
                papersList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无相关论文，试试其他关键词</p>
                        <p style="margin-top:10px;font-size:0.9rem;color:#999;">提示：运行爬虫来获取更多论文数据</p>
                    </div>
                `;
            }
        }

        // 渲染论文卡片
        function renderPaperCard(paper) {
            let authors = '未知作者';
            try {
                const authorsArray = JSON.parse(paper.authors || '[]');
                authors = authorsArray.join(', ');
            } catch (e) {
                authors = paper.authors || '未知作者';
            }

            let categories = [];
            try {
                categories = JSON.parse(paper.categories || '[]');
            } catch (e) {
                categories = [];
            }

            return `
                <div class="paper-card">
                    <div class="paper-title">${escapeHtml(paper.title)}</div>
                    <div class="paper-meta">
                        <span>✍️ ${authors.substring(0, 100)}${authors.length > 100 ? '...' : ''}</span>
                        <span>📅 ${paper.published_at ? new Date(paper.published_at).toLocaleDateString('zh-CN') : ''}</span>
                        ${categories.map(cat => `<span class="paper-tag">${cat}</span>`).join('')}
                    </div>
                    <div class="paper-links">
                        <a href="${paper.source_url}" target="_blank" class="paper-link">🔗 arXiv 页面</a>
                        ${paper.pdf_url ? `<a href="${paper.pdf_url}" target="_blank" class="paper-link">📄 PDF 下载</a>` : ''}
                    </div>
                </div>
            `;
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 获取选中的分类
        function getSelectedCategories() {
            const checkboxes = document.querySelectorAll('#categoryCheckboxes input:checked');
            return Array.from(checkboxes).map(cb => cb.value).join(',');
        }

        // 启动爬虫
        async function startCrawler() {
            const years = parseFloat(document.getElementById('yearsInput').value);
            const maxResults = parseInt(document.getElementById('maxResultsInput').value);
            const categories = getSelectedCategories();

            if (!categories) {
                alert('请至少选择一个研究方向');
                return;
            }

            const btn = document.getElementById('startCrawlerBtn');
            btn.disabled = true;
            btn.textContent = '🚀 启动中...';

            try {
                const response = await fetch('/crawler/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        years: years,
                        categories: categories,
                        max_results: maxResults
                    })
                });
                const data = await response.json();

                if (data.success) {
                    alert('爬虫已启动！');
                    refreshCrawlerStatus();
                    logRefreshInterval = setInterval(refreshCrawlerStatus, 2000);
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error('启动爬虫失败:', error);
                alert('启动爬虫失败，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 开始爬取';
            }
        }

        // 刷新爬虫状态
        async function refreshCrawlerStatus() {
            try {
                const response = await fetch('/crawler/status');
                const data = await response.json();

                const statusBadge = document.getElementById('statusBadge');
                const btn = document.getElementById('startCrawlerBtn');
                const logContainer = document.getElementById('logContainer');

                if (data.is_running) {
                    statusBadge.className = 'status-badge running';
                    statusBadge.innerHTML = '▶️ 运行中';
                    btn.disabled = true;
                    btn.textContent = '🕷️ 爬取中...';
                } else {
                    statusBadge.className = 'status-badge idle';
                    statusBadge.innerHTML = '⏸️ 空闲';
                    btn.disabled = false;
                    btn.textContent = '🚀 开始爬取';
                }

                // 更新日志
                if (data.logs && data.logs.length > 0) {
                    logContainer.innerHTML = data.logs.map(line => 
                        `<div class="log-line">${escapeHtml(line)}</div>`
                    ).join('');
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
            } catch (error) {
                console.error('获取状态失败:', error);
            }
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
