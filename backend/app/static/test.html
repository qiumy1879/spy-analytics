<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        h1 { text-align: center; }
        .test-box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .success { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <h1>✅ 测试页面加载成功！</h1>
    <div class="test-box">
        <h2>测试项目：</h2>
        <p>1. HTML 渲染：<span class="success">✅ 正常</span></p>
        <p>2. CSS 样式：<span class="success">✅ 正常</span></p>
        <p>3. Trae 预览链接：<span class="success">✅ 可访问</span></p>
        <p id="api-test">4. API 测试：<span style="color:#666;">等待中...</span></p>
    </div>

    <script>
        // 简单的API测试
        async function testAPI() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('api-test').innerHTML = 
                    '4. API 测试：<span class="success">✅ 正常 - ' + JSON.stringify(data) + '</span>';
            } catch (error) {
                document.getElementById('api-test').innerHTML = 
                    '4. API 测试：<span style="color:#ef4444;">❌ 失败 - ' + error.message + '</span>';
            }
        }
        testAPI();
    </script>
</body>
</html>
